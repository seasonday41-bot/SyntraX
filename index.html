<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#eefaf7">
<title>SyntraX</title>
<style>
:root{--ink:#102b2a;--muted:#718783;--line:#d8e8e4;--jade:#0f9788;--jade2:#49c8b6;--sky:#36aee8;--soft:#f4faf9;--white:#fff;--shadow:0 18px 50px rgba(24,82,74,.10)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Thai',sans-serif;background:radial-gradient(circle at 20% 0,#dff8f2 0,transparent 31%),linear-gradient(180deg,#f1fbf8 0,#fbfcfd 46%,#edf8f5 100%)}
.app{max-width:680px;margin:auto;padding:16px 12px 44px}.hero{display:flex;align-items:center;gap:14px;padding:16px 5px 14px}.logo{width:60px;height:60px;border-radius:20px;background:linear-gradient(145deg,#9be7db,#16a48f);box-shadow:0 14px 30px rgba(16,156,141,.23);display:grid;place-items:center;color:#fff;font-size:25px;font-weight:950}.hero h1{font-size:34px;line-height:1;margin:0;letter-spacing:-1.2px}.hero p{margin:6px 0 0;color:var(--muted);font-size:14px}.status{display:flex;gap:8px;flex-wrap:wrap;margin:0 5px 15px}.pill{border:1px solid var(--line);background:rgba(255,255,255,.84);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:850;color:#4e6863;box-shadow:0 4px 14px rgba(32,78,71,.04)}.online:before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:#38d27e;margin-right:7px;box-shadow:0 0 0 5px rgba(56,210,126,.12)}
.card{background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:26px;padding:17px;box-shadow:var(--shadow);margin-bottom:14px}.rowHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.rowHead b{font-size:15px}.count{font-size:12px;color:var(--muted)}.searchWrap{position:relative}.searchWrap .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#78908b}.search{width:100%;height:54px;border:1px solid #cfe1dd;border-radius:18px;background:#f9fcfb;padding:0 44px;font-size:16px;color:var(--ink);outline:none}.search:focus{border-color:#70cbbb;box-shadow:0 0 0 4px rgba(73,200,182,.13)}.clear{position:absolute;right:9px;top:8px;width:38px;height:38px;border:0;background:transparent;border-radius:12px;color:#7d938e;font-size:22px}.select{width:100%;height:56px;margin-top:10px;border:1px solid #cfe1dd;border-radius:18px;background:#fff;padding:0 15px;font-size:16px;color:var(--ink);outline:none}
.loading,.empty{text-align:center;color:var(--muted);padding:28px 16px}.empty{display:none}.result{display:none}.marketTop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.marketTop h2{font-size:28px;line-height:1.15;margin:0}.source{margin-top:6px;color:var(--muted);font-size:13px}.latestTag{white-space:nowrap;padding:7px 10px;border-radius:999px;background:#e8f8f3;color:#117466;font-size:11px;font-weight:900}.winbox{margin-top:18px;padding:19px 14px;border:1px solid #d6ece7;border-radius:25px;background:linear-gradient(145deg,#f0fbf8,#e8f7f4);text-align:center}.eyebrow{font-size:11px;letter-spacing:1.7px;font-weight:950;color:#5d8079}.win6{font-size:49px;line-height:1.08;font-weight:950;letter-spacing:8px;color:#075f56;margin:8px 0 12px}.miniGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini{padding:11px 7px;border:1px solid #e1efec;border-radius:17px;background:#fff}.mini span{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.mini b{font-size:17px}.section{margin-top:20px}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.sectionTitle h3{font-size:18px;margin:0}.sectionTitle small{font-size:11px;color:var(--muted)}.chips{display:flex;gap:9px;flex-wrap:wrap}.chip{min-width:59px;padding:10px 14px;border:1px solid #e0ece9;border-radius:16px;background:#f1f7f6;text-align:center;font-size:20px}.chip.hot{background:#dcf6ee;border-color:#bde9dc;color:#07685d;font-weight:950;box-shadow:0 8px 18px rgba(16,156,141,.10)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:21px}.btn{height:52px;border:0;border-radius:17px;font-size:15px;font-weight:900}.primary{color:#fff;background:linear-gradient(135deg,var(--jade),var(--jade2));box-shadow:0 12px 24px rgba(15,151,136,.20)}.secondary{color:#365f59;background:#eef5f4;border:1px solid #d8e7e4}.foot{padding:8px 16px;text-align:center;color:#879995;font-size:11px;line-height:1.55}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.2s;background:#123d39;color:#fff;border-radius:999px;padding:11px 16px;font-size:13px;font-weight:850;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:420px){.app{padding:11px 9px 34px}.hero h1{font-size:31px}.logo{width:55px;height:55px}.card{padding:15px;border-radius:23px}.win6{font-size:42px;letter-spacing:6px}.miniGrid{gap:6px}.mini{padding:10px 4px}.mini b{font-size:15px}.actions{grid-template-columns:1fr}.chip{min-width:55px;font-size:19px}}
</style>
</head>
<body>
<div class="app">
  <header class="hero"><div class="logo">X</div><div><h1>SyntraX</h1><p>Market Flow · Customer View</p></div></header>
  <div class="status"><span class="pill online">ONLINE</span><span class="pill" id="marketPill">กำลังโหลด</span><span class="pill">FLOW V1.1</span></div>

  <section class="card">
    <div class="rowHead"><b>ค้นหาและเลือกตลาด</b><span class="count" id="count"></span></div>
    <div class="searchWrap"><span class="ico">⌕</span><input id="search" class="search" type="search" placeholder="พิมพ์ชื่อตลาด เช่น ลาวพัฒนา" autocomplete="off"><button id="clear" class="clear" aria-label="ล้าง">×</button></div>
    <select id="market" class="select" aria-label="เลือกตลาด"></select>
  </section>

  <div id="loading" class="card loading">กำลังโหลดผลล่าสุด...</div>
  <div id="empty" class="card empty">ไม่พบตลาดที่ค้นหา</div>

  <main id="result" class="card result">
    <div class="marketTop"><div><h2 id="marketName">-</h2><div id="source" class="source">-</div></div><span class="latestTag">ผลล่าสุด</span></div>
    <div class="winbox"><div class="eyebrow">WIN6</div><div id="win6" class="win6">------</div><div class="miniGrid"><div class="mini"><span>Reserve</span><b id="reserve">-</b></div><div class="mini"><span>WIN7</span><b id="win7">-</b></div><div class="mini"><span>รูด</span><b id="rud">-</b></div></div></div>
    <section class="section"><div class="sectionTitle"><h3>🎯 เจาะ 2</h3><small>กลับได้</small></div><div id="pair2" class="chips"></div></section>
    <section class="section"><div class="sectionTitle"><h3>🎯 เจาะ 3</h3><small>โต๊ดนับเข้า</small></div><div id="pair3" class="chips"></div></section>
    <div class="actions"><button id="copyAll" class="btn primary">คัดลอกทั้งหมด</button><button id="copyWin" class="btn secondary">คัดลอก WIN6</button></div>
  </main>
  <div class="foot">ข้อมูลเป็นแนวทางจากการวิเคราะห์รูปแบบย้อนหลัง ไม่ใช่การรับประกันผล</div>
</div>
<div id="toast" class="toast">คัดลอกแล้ว</div>
<script>
const API='https://syntra-zeta-nine.vercel.app/api/customer-results';
const el=id=>document.getElementById(id),E={search:el('search'),market:el('market'),clear:el('clear'),count:el('count'),marketPill:el('marketPill'),loading:el('loading'),empty:el('empty'),result:el('result'),marketName:el('marketName'),source:el('source'),win6:el('win6'),reserve:el('reserve'),win7:el('win7'),rud:el('rud'),pair2:el('pair2'),pair3:el('pair3'),toast:el('toast')};
let all=[],filtered=[],current=null;
const fmtDate=s=>{if(!s)return'-';const d=new Date(s+'T00:00:00');return new Intl.DateTimeFormat('th-TH',{day:'numeric',month:'short',year:'2-digit'}).format(d)};
const spaced=s=>String(s||'').split('').join(' • ');
function chipHtml(arr,strong){return(arr||[]).map(x=>`<span class="chip ${x===strong?'hot':''}">${x}</span>`).join('')||'<span style="color:#80918d">-</span>'}
function render(r){current=r;if(!r){E.result.style.display='none';return}localStorage.setItem('syntrax_market',r.market_key);E.marketName.textContent=r.market_name;E.source.textContent=`ฐานล่าสุด ${fmtDate(r.source_draw_date)} · ${r.source_top3}-${r.source_bottom2}`;E.win6.textContent=r.win6;E.reserve.textContent=r.reserve7;E.win7.textContent=r.win7;E.rud.textContent=spaced(r.rud);E.pair2.innerHTML=chipHtml(r.pair2,r.strong2);E.pair3.innerHTML=chipHtml(r.pair3,r.strong3);E.result.style.display='block'}
function rebuild(preserve=true){const q=E.search.value.trim().toLowerCase();filtered=all.filter(x=>!q||x.market_name.toLowerCase().includes(q)||x.market_key.toLowerCase().includes(q));E.count.textContent=`พบ ${filtered.length}/${all.length} ตลาด`;E.empty.style.display=filtered.length?'none':'block';E.market.style.display=filtered.length?'block':'none';if(!filtered.length){render(null);return}const old=preserve?E.market.value:'';E.market.innerHTML=filtered.map(x=>`<option value="${x.market_key}">${x.market_name}</option>`).join('');const wanted=filtered.find(x=>x.market_key===old)||filtered.find(x=>x.market_key===localStorage.getItem('syntrax_market'))||filtered.find(x=>x.market_name==='ลาวพัฒนา')||filtered[0];E.market.value=wanted.market_key;render(wanted)}
function toast(msg='คัดลอกแล้ว'){E.toast.textContent=msg;E.toast.classList.add('show');setTimeout(()=>E.toast.classList.remove('show'),1400)}
async function copyText(text){try{await navigator.clipboard.writeText(text)}catch{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}toast()}
function copyAll(){if(!current)return;const r=current;copyText(`🍀 SyntraX | ${r.market_name}\n${r.source_top3}-${r.source_bottom2}\n\n🔥 WIN6 ${spaced(r.win6)}\n⚡ รูด ${spaced(r.rud)}\n🎯 เจาะ 2 ${r.pair2.join(' • ')}\n🎯 เจาะ 3 ${r.pair3.join(' • ')}\nReserve ${r.reserve7} · WIN7 ${r.win7}`)}
E.search.addEventListener('input',()=>rebuild(false));E.clear.onclick=()=>{E.search.value='';rebuild(false);E.search.focus()};E.market.addEventListener('change',()=>render(filtered.find(x=>x.market_key===E.market.value)));el('copyAll').onclick=copyAll;el('copyWin').onclick=()=>current&&copyText(current.win6);
(async()=>{try{const r=await fetch(API,{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'โหลดข้อมูลไม่ได้');all=d.results||[];E.marketPill.textContent=`${all.length} ตลาด`;E.loading.style.display='none';rebuild(false)}catch(e){E.loading.textContent='ไม่สามารถโหลดผลล่าสุดได้ · '+e.message;E.marketPill.textContent='OFFLINE'}})();
</script>
</body>
</html>
